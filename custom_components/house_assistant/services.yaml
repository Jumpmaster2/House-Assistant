export_parameters:
  fields:
    entity_id:
      required: false
      selector:
        entity:
          integration: house_assistant
          domain: climate
          multiple: true

import_parameters:
  fields:
    data:
      required: true
      selector:
        object:
    entity_id:
      required: false
      selector:
        entity:
          integration: house_assistant
          domain: climate
          multiple: true

reset_learned:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: house_assistant
          domain: climate
          multiple: true
    include_parameters:
      required: false
      default: false
      selector:
        boolean:

run_ai_check:

run_ai_ventilation_check:

decide_heating_day:
  fields:
    use_ai:
      required: false
      default: true
      selector:
        boolean:

move_cover:
  fields:
    entity_id:
      selector:
        entity:
          domain: cover
          multiple: true
    action:
      required: true
      example: evening
      selector:
        select:
          translation_key: service_action
          options:
            - open
            - close
            - evening
            - sun_protection
            - ventilation
            - position
    position:
      example: 40
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

start_cover_override:
  fields:
    entity_id:
      selector:
        entity:
          domain: cover
          multiple: true
    duration:
      example: 120
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min

end_cover_override:
  fields:
    entity_id:
      selector:
        entity:
          domain: cover
          multiple: true

resume_cover:
  fields:
    entity_id:
      selector:
        entity:
          domain: cover
          multiple: true
read_meter:
  description: Administrators only; calls without a user (automations, scripts) are allowed.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: house_assistant
          multiple: true
set_meter_reading:
  description: Administrators only; calls without a user (automations, scripts) are allowed.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: house_assistant
          domain: sensor
          multiple: true
    value:
      required: true
      selector:
        number:
          min: 0
          max: 100000000
          step: any
          mode: box

set_vacation:
  description: Administrators only; calls without a user (automations, scripts) are allowed.
  fields:
    departure:
      required: false
      selector:
        datetime:
    return:
      required: false
      selector:
        datetime:
    clear:
      required: false
      default: false
      selector:
        boolean:
